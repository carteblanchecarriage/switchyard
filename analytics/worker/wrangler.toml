name = "switchyard-analytics"
main = "index.js"
compatibility_date = "2024-01-01"

# KV Namespace for analytics data
[[kv_namespaces]]
binding = "ANALYTICS_KV"
id = "your_kv_namespace_id_here"
preview_id = "your_preview_kv_namespace_id_here"

# Analytics Engine (optional - for large-scale analytics)
# [[analytics_engine_datasets]]
# binding = "ANALYTICS_ENGINE"
# dataset = "switchyard_analytics"

# Environment variables
[vars]
ENVIRONMENT = "production"

# Secrets (set via wrangler secret)
# ANALYTICS_TOKEN = "your_secret_token_for_api_access"

# Routes (custom domain)
# [[routes]]
# pattern = "analytics.switchyard.club/*"
# custom_domain = true

# Development environment
[env.development]
name = "switchyard-analytics-dev"
vars = { ENVIRONMENT = "development" }

# Staging environment
[env.staging]
name = "switchyard-analytics-staging"
vars = { ENVIRONMENT = "staging" }